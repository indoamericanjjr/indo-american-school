services:
  - type: web
    name: indo-american-connect
    env: node
    plan: starter
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        fromService:
          name: supabase
          key: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          name: supabase
          key: SUPABASE_SERVICE_ROLE_KEY
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          name: cloudinary
          key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromService:
          name: cloudinary
          key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          name: cloudinary
          key: CLOUDINARY_API_SECRET
      - key: JWT_SECRET
        value: change-me
      - key: ADMIN_USERNAME
        value: ias
      - key: ADMIN_PASSWORD_HASH
        value: $2b$10$nswerg1HOlt3G.wSBhoxeOLuMcqpO8DJn2k4nqvJ0ubI.rsjes.Bm
    rootDir: .
    autoDeploy: true
    plan: free
