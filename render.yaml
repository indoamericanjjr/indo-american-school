services:
  - type: web
    name: indo-american-connect
    env: node
    plan: starter
    buildCommand: SHARP_IGNORE_GLOBAL_LIBVIPS=1 NPM_CONFIG_PRODUCTION=false npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: SHARP_IGNORE_GLOBAL_LIBVIPS
        value: "1"
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
    rootDir: .
    autoDeploy: true
    plan: free

